name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build www/ from the existing PWA (no source files are modified)
        run: npm run build:www

      - name: Sync Capacitor (copies www/ into the Android project)
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK found: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload APK artifact (secondary backup)
        uses: actions/upload-artifact@v4
        with:
          name: TA-Toolkit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | sed -E 's/versionName "(.+)"/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from android/app/build.gradle"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=TA-Toolkit-v$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release asset
        run: cp "android/app/build/outputs/apk/debug/app-debug.apk" "${{ steps.version.outputs.apk_name }}"

      - name: Create/update GitHub Release with APK asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TA Toolkit ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.apk_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
